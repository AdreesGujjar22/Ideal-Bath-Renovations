              <h3 style="font-size: 17px; font-weight: 700; color: #0f172a; margin-bottom: 8px;">How much does a bathroom remodel cost in Langley, BC?</h3>
              <p style="font-size: 14.5px; color: #475569; line-height: 1.65;">A standard tub-to-shower conversion or powder room remodel typically ranges from $9,500 to $18,000, while a full gut master ensuite overhaul with custom tile, custom double vanity, and freestanding tub ranges from $22,000 to $45,000+. We provide comprehensive, itemized, fixed-price contracts so there are never hidden costs.</p>

            <div style="border-bottom: 1px solid #e2e8f0; padding: 18px 0;">
